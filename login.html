<body>

  <div class="login-container">

    <div class="login-box">

      <div class="logo">
        <h1>BINSOUD HABARI</h1>
        <p>Sehemu ya Waandishi na Wasimamizi</p>
      </div>

      <form id="loginForm">

        <div class="input-group">
          <label for="email">Barua pepe</label>
          <input
            type="email"
            id="email"
            placeholder="Ingiza barua pepe"
            autocomplete="email"
            required
          >
        </div>

        <div class="input-group">
          <label for="password">Nenosiri</label>
          <input
            type="password"
            id="password"
            placeholder="Ingiza nenosiri"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          INGIA
        </button>

        <div id="message"></div>

      </form>

      <a href="index.html" class="back-home">
        ← Rudi kwenye BINSOUD HABARI
      </a>

  </div>


  <!-- Firebase -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut
    }
      from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    }
      from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


    // ==========================================
    // FIREBASE CONFIG
    // ==========================================

    const firebaseConfig = {
      apiKey: "AIzaSyCFpSNTqw9ljOFkxA-szNcNi-HmVKZU-7I",
      authDomain: "binsoud-habari-8a5fa.firebaseapp.com",
      projectId: "binsoud-habari-8a5fa",
      storageBucket: "binsoud-habari-8a5fa.firebasestorage.app",
      messagingSenderId: "865091074307",
      appId: "1:865091074307:web:27b26aa8f0f3476ef45136",
      measurementId: "G-MH266J0XKE"
    };


    // ==========================================
    // INITIALIZE FIREBASE
    // ==========================================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // ==========================================
    // ELEMENTS
    // ==========================================

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");


    // ==========================================
    // MESSAGE FUNCTION
    // ==========================================

    function showMessage(text, type = "error") {

      message.textContent = text;

      message.className = "";

      message.classList.add(type);

      message.style.display = "block";
    }


    // ==========================================
    // LOGIN
    // ==========================================

    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();


      const email = emailInput.value.trim();

      const password = passwordInput.value;


      if (!email || !password) {

        showMessage(
          "Tafadhali jaza barua pepe na nenosiri."
        );

        return;
      }


      // Disable button

      loginBtn.disabled = true;

      loginBtn.innerHTML =
        '<span class="loading"></span> Inaingia...';

      message.style.display = "none";


      try {

        // ======================================
        // 1. LOGIN FIREBASE AUTHENTICATION
        // ======================================

        const credential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user = credential.user;


        console.log("Firebase login successful");

        console.log("UID:", user.uid);

        console.log("Email:", user.email);


        // ======================================
        // 2. GET USER PROFILE
        // ======================================

        const userRef =
          doc(db, "users", user.uid);

        const userSnapshot =
          await getDoc(userRef);


        console.log(
          "User profile exists:",
          userSnapshot.exists()
        );


        // ======================================
        // 3. CHECK USER PROFILE
        // ======================================

        if (!userSnapshot.exists()) {

          await signOut(auth);

          showMessage(
            "Akaunti imeingia Firebase Authentication lakini profile ya mtumiaji haipo kwenye Firestore. Hakikisha umeunda users/" +
            user.uid
          );

          return;
        }


        const userData =
          userSnapshot.data();


        console.log("User data:", userData);


        // ======================================
        // 4. CHECK ACTIVE STATUS
        // ======================================

        if (userData.active !== true) {

          await signOut(auth);

          showMessage(
            "Akaunti hii haijawezeshwa. Wasiliana na msimamizi."
          );

          return;
        }


        // ======================================
        // 5. CHECK ROLE
        // ======================================

        const role = userData.role;


        // ======================================
        // ADMIN
        // ======================================

        if (role === "admin") {

          showMessage(
            "Umefanikiwa kuingia. Unaelekezwa kwenye Admin Panel...",
            "success"
          );


          setTimeout(() => {

            window.location.href = "admin.html";

          }, 500);


          return;
        }


        // ======================================
        // WRITER
        // ======================================

        if (role === "writer") {

          showMessage(
            "Umefanikiwa kuingia. Unaelekezwa kwenye Writer Panel...",
            "success"
          );


          setTimeout(() => {

            window.location.href = "writer.html";

          }, 500);


          return;
        }


        // ======================================
        // UNKNOWN ROLE
        // ======================================

        await signOut(auth);

        showMessage(
          "Akaunti yako haina role inayotambulika. Wasiliana na admin."
        );

      }


      // ========================================
      // FIREBASE ERRORS
      // ========================================

      catch (error) {

        console.error(
          "Firebase login error:",
          error
        );


        let errorMessage =
          "Imeshindikana kuingia.";


        switch (error.code) {


          case "auth/invalid-credential":

            errorMessage =
              "Barua pepe au nenosiri si sahihi.";

            break;


          case "auth/invalid-email":

            errorMessage =
              "Muundo wa barua pepe si sahihi.";

            break;


          case "auth/user-not-found":

            errorMessage =
              "Akaunti hii haipo kwenye Firebase Authentication.";

            break;


          case "auth/wrong-password":

            errorMessage =
              "Nenosiri si sahihi.";

            break;


          case "auth/too-many-requests":

            errorMessage =
              "Majaribio ya kuingia yamekuwa mengi. Subiri kidogo kisha ujaribu tena.";

            break;


          case "auth/network-request-failed":

            errorMessage =
              "Hakuna muunganisho mzuri wa internet.";

            break;


          case "auth/api-key-not-valid.-please-pass-a-valid-api-key.":

            errorMessage =
              "Firebase API Key si sahihi. Hakikisha umetumia API Key ya Firebase project binsoud-habari-8a5fa.";

            break;


          case "permission-denied":

            errorMessage =
              "Firebase Firestore imekataa kusoma profile ya mtumiaji. Kagua Firestore Security Rules.";

            break;


          default:

            errorMessage =
              "Kosa la Firebase: " +
              error.code +
              " — " +
              error.message;

            break;
        }


        showMessage(errorMessage);

      }


      finally {

        loginBtn.disabled = false;

        loginBtn.textContent = "INGIA";

      }

    });

  </script>

</body>
</html>
