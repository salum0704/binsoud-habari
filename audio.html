<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Audio | BINSOUD HABARI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f6f9;
  color: #172b3a;
}

header {
  background: #032f52;
  color: white;
  padding: 18px 5%;
}

.header-inner {
  max-width: 1200px;
  margin: auto;
}

header h1 {
  font-size: 25px;
  margin-bottom: 12px;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

nav a {
  color: white;
  text-decoration: none;
  padding: 9px 13px;
  background: #0878c9;
  border-radius: 6px;
  font-size: 14px;
}

nav a:hover {
  background: #005b99;
}

.container {
  width: min(1150px, 94%);
  margin: 25px auto;
}

.page-title {
  margin-bottom: 20px;
}

.page-title h2 {
  font-size: 27px;
  margin-bottom: 8px;
}

.page-title p {
  color: #667784;
  line-height: 1.5;
}

.search-box {
  margin-bottom: 22px;
}

.search-box input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d2dce5;
  border-radius: 8px;
  font-size: 16px;
}

.audio-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.audio-card {
  background: white;
  border-radius: 11px;
  overflow: hidden;
  box-shadow: 0 4px 15px #0000000d;
  display: flex;
  flex-direction: column;
}

.audio-image {
  width: 100%;
  height: 190px;
  object-fit: cover;
  background: #dce5ec;
}

.audio-content {
  padding: 16px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.audio-topic {
  display: inline-block;
  background: #e5f3fc;
  color: #0768a9;
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 12px;
  width: fit-content;
  margin-bottom: 10px;
}

.audio-card h3 {
  font-size: 19px;
  line-height: 1.4;
  margin-bottom: 9px;
}

.audio-meta {
  color: #71808b;
  font-size: 13px;
  margin-bottom: 12px;
}

.audio-description {
  color: #4c5c68;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 12px;
}

audio {
  width: 100%;
  margin-top: auto;
  min-height: 42px;
}

.audio-error {
  color: #b42318;
  font-size: 13px;
  margin-top: 8px;
  line-height: 1.5;
}

.empty-message {
  background: white;
  padding: 25px;
  text-align: center;
  border-radius: 10px;
  color: #667784;
  grid-column: 1 / -1;
}

.loading {
  text-align: center;
  padding: 30px;
  color: #667784;
}

footer {
  background: #032f52;
  color: white;
  text-align: center;
  padding: 22px;
  margin-top: 40px;
}

@media(max-width: 850px) {
  .audio-list {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media(max-width: 550px) {
  .audio-list {
    grid-template-columns: 1fr;
  }

  header h1 {
    font-size: 21px;
  }

  .page-title h2 {
    font-size: 23px;
  }
}
</style>
  <link rel="stylesheet" href="assets/ads.css">
</head>

<body>

<header>
  <div class="header-inner">
    <h1>📰 BINSOUD HABARI</h1>

    <nav>
      <a href="index.html">Mwanzo</a>
      <a href="habari.html">Habari</a>
      <a href="audio.html">Audio</a>
      <a href="kuhusu.html">Kuhusu Sisi</a>
      <a href="wasiliana.html">Wasiliana</a>
    </nav>
<section class="bh-ad-slot" data-bh-ad="top" aria-label="Tangazo la juu" hidden></section>

  </div>
</header>

<main class="container">
<aside class="bh-sidebar-slot" data-bh-ad="sidebar" aria-label="Tangazo la pembeni" hidden></aside>


  <section class="page-title">
    <h2>🎧 Habari za Kusikiliza</h2>
    <p>
      Sikiliza habari, makala na mazungumzo mbalimbali
      kupitia BINSOUD HABARI.
    </p>
  </section>

  <section class="search-box">
    <input
      type="search"
      id="searchInput"
      placeholder="Tafuta audio..."
      aria-label="Tafuta audio"
    >
  </section>

  <section>
    <div id="audioList" class="audio-list">
      <div class="loading">Inapakia audio...</div>
    </div>
  </section>

</main>

<section class="bh-ad-slot" data-bh-ad="bottom" aria-label="Tangazo la chini" hidden></section>
<footer>
  <p>© <span id="year"></span> BINSOUD HABARI. Haki zote zimehifadhiwa.</p>
</footer>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


/* FIREBASE CONFIGURATION */

const firebaseConfig = {
  apiKey: "AIzaSyCFpSNTqw9ljOFkxA-szNcNi-HmVKZU-7I",
  authDomain: "binsoud-habari-8a5fa.firebaseapp.com",
  projectId: "binsoud-habari-8a5fa",
  messagingSenderId: "865091074307",
  appId: "1:865091074307:web:27b26aa8f0f3476ef45136",
  measurementId: "G-MH266J0XKE"
};


/* INITIALIZE FIREBASE */

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* VARIABLES */

const audioList = document.getElementById("audioList");
const searchInput = document.getElementById("searchInput");

let allAudio = [];


/* YEAR */

document.getElementById("year").textContent =
  new Date().getFullYear();


/* SAFE TEXT */

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* NORMALIZE GOOGLE DRIVE URL */

function normalizeAudioUrl(rawUrl) {

  const value = String(rawUrl || "").trim();

  if (!value) return "";

  const match =
    value.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/) ||
    value.match(/[?&]id=([a-zA-Z0-9_-]+)/);

  if (match && value.includes("drive.google.com")) {
    return "https://drive.google.com/uc?export=download&id=" + match[1];
  }

  return value;
}


/* FORMAT DATE */

function formatDate(item) {

  if (item.createdAt && item.createdAt.toDate) {
    return item.createdAt.toDate().toLocaleDateString("sw-TZ", {
      day: "numeric",
      month: "long",
      year: "numeric"
    });
  }

  return item.date || "";
}


/* LOAD AUDIO FROM FIRESTORE */

async function loadAudio() {

  try {

    audioList.innerHTML =
      '<div class="loading">Inapakia audio...</div>';

    const snapshot = await getDocs(
      collection(db, "articles")
    );

    allAudio = snapshot.docs
      .map(document => ({
        id: document.id,
        ...document.data()
      }))
      .filter(item => {

        const category =
          String(item.category || "").toLowerCase();

        const status =
          String(item.status || "").toLowerCase();

        return category === "audio" &&
          (status === "published" || status === "");

      })
      .sort((a, b) => {

        const dateA =
          a.createdAt?.toMillis?.() || 0;

        const dateB =
          b.createdAt?.toMillis?.() || 0;

        return dateB - dateA;

      });

    renderAudio(allAudio);

  } catch (error) {

    console.error("Audio loading error:", error);

    audioList.innerHTML = `
      <div class="empty-message">
        Imeshindikana kupakia audio.
        Tafadhali jaribu tena baadaye.
        <p>${escapeHTML(error.message)}</p>
      </div>
    `;

  }

}


/* DISPLAY AUDIO */

function renderAudio(items) {

  if (!items.length) {

    audioList.innerHTML = `
      <div class="empty-message">
        <h3>Hakuna audio iliyopatikana.</h3>
        <p>Jaribu kutafuta jina lingine au rudi baadaye.</p>
      </div>
    `;

    return;

  }

  audioList.innerHTML = items.map(item => {

    const title =
      escapeHTML(item.title || "Audio bila kichwa");

    const topic =
      escapeHTML(item.audioTopic || "Audio");

    const author =
      escapeHTML(item.author || "BINSOUD HABARI");

    const description =
      escapeHTML(
        item.description ||
        item.intro ||
        "Sikiliza audio hii."
      );

    const date =
      escapeHTML(formatDate(item));

    const image =
      escapeHTML(item.image || item.imageUrl || "");

    const audioUrl =
      escapeHTML(normalizeAudioUrl(item.audioUrl || ""));

    return `

      <article class="audio-card">

        ${
          image
          ? `
            <img
              class="audio-image"
              src="${image}"
              alt="${title}"
              loading="lazy"
            >
          `
          : `
            <div
              class="audio-image"
              style="
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:55px;
              "
            >
              🎧
            </div>
          `
        }

        <div class="audio-content">

          <span class="audio-topic">
            ${topic}
          </span>

          <h3>${title}</h3>

          <p class="audio-meta">
            ${author}
            ${date ? " • " + date : ""}
          </p>

          <p class="audio-description">
            ${description}
          </p>

          ${
            audioUrl
            ? `
              <audio
                controls
                preload="none"
                src="${audioUrl}"
              >
                Kivinjari chako hakiwezi kucheza sauti hii.
              </audio>

              <p class="audio-error"></p>
            `
            : `
              <p class="audio-error">
                Kiungo cha sauti hakijawekwa.
              </p>
            `
          }

        </div>

      </article>

    `;

  }).join("");


  /* SHOW AUDIO PLAYBACK ERRORS */

  document.querySelectorAll(".audio-card audio").forEach(player => {

    player.addEventListener("error", () => {

      const message =
        player.parentElement.querySelector(".audio-error");

      if (message) {
        message.textContent =
          "Sauti haijafunguka. Huenda URL si ya moja kwa moja ya MP3, au faili halijaruhusiwa kwa umma.";
      }

    });

  });

}


/* SEARCH AUDIO */

searchInput.addEventListener("input", () => {

  const term =
    searchInput.value.trim().toLowerCase();

  const filtered = allAudio.filter(item => {

    const title =
      String(item.title || "").toLowerCase();

    const topic =
      String(item.audioTopic || "").toLowerCase();

    const description =
      String(item.description || "").toLowerCase();

    const author =
      String(item.author || "").toLowerCase();

    return (
      title.includes(term) ||
      topic.includes(term) ||
      description.includes(term) ||
      author.includes(term)
    );

  });

  renderAudio(filtered);

});


/* START */

loadAudio();

</script>

  <script type="module" src="assets/ads.js"></script>
</body>
</html>
